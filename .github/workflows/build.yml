name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o DigiRegNotify.zip -d extracted
          # Move the extracted project's contents up so gradle finds them at the repo root
          cp -r extracted/DigiRegNotify/. .

      - name: Read version
        id: ver
        run: |
          base=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "base=${base:-1.0}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug -PciBuildNumber=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RegisterPlus-${{ steps.ver.outputs.base }}.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RegisterPlus-${{ steps.ver.outputs.base }}.${{ github.run_number }}
          path: RegisterPlus-${{ steps.ver.outputs.base }}.${{ github.run_number }}.apk
